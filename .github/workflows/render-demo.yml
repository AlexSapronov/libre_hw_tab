name: Render EVA startup demo
on:
  push:
    branches: [demo/eva-boot-render]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Render native Canvas at 24 fps
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest --tests dev.librehw.tab.BootDemoRenderTest
      - uses: actions/upload-artifact@v4
        with:
          name: eva-boot-demo-frames
          path: android/app/build/demo-frames/*.png
