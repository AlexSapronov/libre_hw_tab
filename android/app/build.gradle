plugins { id 'com.android.application' }
// Public development key: consistent installable previews, never a store/release signing identity.
def previewKey = rootProject.layout.buildDirectory.file('signing/preview.p12').get().asFile
previewKey.parentFile.mkdirs()
previewKey.bytes = rootProject.file('preview-signing.p12.base64').text.trim().decodeBase64()
android {
    namespace 'dev.librehw.tab'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.librehw.tab'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '1.7.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug {
            storeFile previewKey
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.includeAndroidResources = true }
    lint { abortOnError true }
}

dependencies {
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "androidx.activity:activity:1.9.3"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
}
